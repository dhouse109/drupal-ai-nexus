<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Applied AI Open Graph preview</title>
  <desc id="desc">Branded 109.studio preview card for applied AI strategy and workflow engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101211"/><stop offset="0.6" stop-color="#090a0a"/><stop offset="1" stop-color="#17110b"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="0.45" stop-color="#c8c0af"/><stop offset="1" stop-color="#817767"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb22f"/><stop offset="1" stop-color="#f05a00"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/></pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="438" cy="310" r="260" fill="#f97316" opacity="0.10" filter="url(#glow)"/>
  <g transform="translate(86 110) scale(0.9)" filter="url(#shadow)" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M130 70H260L338 148H374" fill="none" stroke="url(#metal)" stroke-width="20"/><path d="M130 70V230H210V150L288 228" fill="none" stroke="url(#metal)" stroke-width="20"/>
    <path d="M650 408L728 486H858V326H778V406L700 328" fill="none" stroke="url(#metal)" stroke-width="20"/>
    <circle cx="470" cy="265" r="132" fill="none" stroke="url(#metal)" stroke-width="18"/><path d="M238 448L684 2" stroke="url(#metal)" stroke-width="18"/>
    <circle cx="226" cy="460" r="34" fill="url(#orange)" stroke="#ffd46d" stroke-width="4"/><circle cx="696" cy="0" r="34" fill="url(#orange)" stroke="#ffd46d" stroke-width="4"/>
    <circle cx="470" cy="265" r="47" fill="url(#metal)"/><circle cx="470" cy="265" r="29" fill="#0b0c0c" stroke="url(#orange)" stroke-width="7"/>
    <path d="M470 112V165M470 365V418M318 265H371M569 265H622" stroke="url(#metal)" stroke-width="17"/>
    <circle cx="152" cy="265" r="30" fill="none" stroke="url(#metal)" stroke-width="14"/><circle cx="772" cy="265" r="30" fill="none" stroke="url(#metal)" stroke-width="14"/>
  </g>
  <g font-family="'Source Code Pro', 'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="610" y="150" fill="#f97316" font-size="22" font-weight="700" letter-spacing="6">APPLIED AI</text>
    <text x="610" y="224" fill="#f7efe2" font-size="56" font-weight="800" letter-spacing="-2">Strategy and</text>
    <text x="610" y="290" fill="#f7efe2" font-size="56" font-weight="800" letter-spacing="-2">workflow engineering</text>
    <text x="610" y="374" fill="#b8afa0" font-size="25" font-weight="500">Practical AI for workflows, content</text>
    <text x="610" y="410" fill="#b8afa0" font-size="25" font-weight="500">operations, retrieval, and governance.</text>
    <path d="M610 500H1040" stroke="#f97316" stroke-width="2" stroke-opacity="0.72"/>
    <text x="610" y="548" fill="#f7efe2" font-size="22" font-weight="700">109.studio</text>
  </g>
</svg>
